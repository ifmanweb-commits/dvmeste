services:
  # PostgreSQL - база данных
  postgres:
    image: postgres:15-alpine
    container_name: dvmeste-db
    environment:
      POSTGRES_USER: ${DB_USER:-dvmeste}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dvmeste_password}
      POSTGRES_DB: ${DB_NAME:-dvmeste_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dvmeste-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dvmeste} -d ${DB_NAME:-dvmeste_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Приложение Next.js
  app:
    build:
      context: .
      target: runner
    container_name: dvmeste-app
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    restart: unless-stopped
    volumes:
      # Файлы пользователей (фото, документы)
      - ./storage/files/users:/app/public/files/users
      # Файлы статей
      - ./storage/files/articles:/app/public/files/articles
      # Файлы страниц
      - ./storage/files/pages:/app/public/files/pages
      # Файлы секретных страниц
      - ./storage/files/secret-pages:/app/public/files/secret-pages
      # Изображения (значки, шаблоны, иконки)
      - ./storage/images:/app/public/images
      # Сертификаты
      - ./storage/certificates:/app/public/certificates
      # Бэкапы
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dvmeste-network

  # Сервис для миграций (использует builder этап с полным node_modules)
  app-migrate:
    build:
      context: .
      target: builder
    container_name: dvmeste-migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dvmeste-network

volumes:
  postgres_data:

networks:
  dvmeste-network:
    driver: bridge